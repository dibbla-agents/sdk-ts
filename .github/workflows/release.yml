name: Release

# Publishes to npm when a GitHub release is published for a tag vX.Y.Z that
# matches package.json. Uses npm trusted publishing: no token is stored, and
# the package gets a provenance attestation. See RELEASING.md for the one-time
# setup on npmjs.com.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: conformance/workers/go/go.mod
          cache-dependency-path: conformance/workers/go/go.sum
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Conformance (reference, and this package as published)
        run: |
          npm run conformance:go
          npm run conformance:packed
      - run: npm publish --provenance --access public
